<svg width="1280" height="320" viewBox="0 0 1280 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Bharat CJ, Team Lead, Full-Stack and AI Engineering">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0f"/>
      <stop offset="55%" stop-color="#07130d"/>
      <stop offset="100%" stop-color="#0a2018"/>
    </linearGradient>
    <linearGradient id="nameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6ee7b7">
        <animate attributeName="stop-color" values="#6ee7b7;#34d399;#2dd4bf;#6ee7b7" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#34d399">
        <animate attributeName="stop-color" values="#34d399;#2dd4bf;#6ee7b7;#34d399" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#2dd4bf">
        <animate attributeName="stop-color" values="#2dd4bf;#6ee7b7;#34d399;#2dd4bf" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <radialGradient id="glowEmerald" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowGold" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- background -->
  <rect width="1280" height="320" fill="url(#bg)"/>
  <rect width="1280" height="320" fill="url(#grid)"/>

  <!-- animated glow orbs -->
  <circle cx="1020" cy="60" r="220" fill="url(#glowEmerald)">
    <animate attributeName="cx" values="1020;960;1020" dur="11s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="60;120;60" dur="11s" repeatCount="indefinite"/>
  </circle>
  <circle cx="180" cy="280" r="200" fill="url(#glowGold)">
    <animate attributeName="cx" values="180;260;180" dur="13s" repeatCount="indefinite"/>
  </circle>
  <circle cx="700" cy="320" r="170" fill="url(#glowEmerald)">
    <animate attributeName="r" values="170;210;170" dur="9s" repeatCount="indefinite"/>
  </circle>

  <!-- floating accent dots -->
  <circle cx="940" cy="200" r="3.5" fill="#34d399" opacity="0.8">
    <animate attributeName="cy" values="200;186;200" dur="5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1120" cy="150" r="2.5" fill="#4ade80" opacity="0.8">
    <animate attributeName="cy" values="150;164;150" dur="6.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1190" cy="235" r="3" fill="#2dd4bf" opacity="0.7">
    <animate attributeName="cy" values="235;220;235" dur="7.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="120" cy="90" r="2.5" fill="#34d399" opacity="0.6">
    <animate attributeName="cy" values="90;104;90" dur="6s" repeatCount="indefinite"/>
  </circle>

  <!-- terminal-style brackets -->
  <text x="64" y="118" font-family="Consolas, 'Courier New', monospace" font-size="26" fill="#10b981" opacity="0.85">&#10095;_</text>

  <!-- name -->
  <text x="64" y="185" font-family="'Segoe UI', Arial, sans-serif" font-size="84" font-weight="800" letter-spacing="-2" fill="url(#nameGrad)">Bharat CJ</text>

  <!-- role -->
  <text x="66" y="232" font-family="'Segoe UI', Arial, sans-serif" font-size="25" font-weight="500" fill="#d4d4d8">Team Lead &#183; Full-Stack &amp; AI Engineering</text>

  <!-- chips -->
  <g font-family="Consolas, 'Courier New', monospace" font-size="15">
    <rect x="64" y="256" rx="14" width="104" height="28" fill="#10b981" fill-opacity="0.12" stroke="#10b981" stroke-opacity="0.45"/>
    <text x="116" y="275" text-anchor="middle" fill="#6ee7b7">8+ years</text>
    <rect x="180" y="256" rx="14" width="120" height="28" fill="#10b981" fill-opacity="0.12" stroke="#10b981" stroke-opacity="0.45"/>
    <text x="240" y="275" text-anchor="middle" fill="#6ee7b7">Payments</text>
    <rect x="312" y="256" rx="14" width="130" height="28" fill="#2dd4bf" fill-opacity="0.12" stroke="#2dd4bf" stroke-opacity="0.45"/>
    <text x="377" y="275" text-anchor="middle" fill="#5eead4">AI Pipelines</text>
    <rect x="454" y="256" rx="14" width="130" height="28" fill="#10b981" fill-opacity="0.12" stroke="#10b981" stroke-opacity="0.45"/>
    <text x="519" y="275" text-anchor="middle" fill="#6ee7b7">Linux Infra</text>
  </g>

  <!-- right-side code motif -->
  <g font-family="Consolas, 'Courier New', monospace" font-size="17" opacity="0.5">
    <text x="950" y="105" fill="#34d399">while (alive) {</text>
    <text x="975" y="133" fill="#a1a1aa">build();</text>
    <text x="975" y="161" fill="#a1a1aa">lead();</text>
    <text x="975" y="189" fill="#6ee7b7">ship();</text>
    <text x="950" y="217" fill="#34d399">}</text>
  </g>

  <!-- bottom accent line -->
  <rect x="0" y="316" width="1280" height="4" fill="url(#nameGrad)"/>
</svg>
